name: ARM64 Tests and Benchmark

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  arm64:
    name: ARM64 Tests and Benchmark
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify ARM64 architecture
        run: |
          echo "=== Architecture ==="
          uname -m

          echo "=== CPU Information ==="
          lscpu

          echo "=== Python Architecture ==="
          python -c "import platform; print(platform.machine())"

          python -c "import platform; assert platform.machine() in ('aarch64', 'arm64'), f'Not ARM64: {platform.machine()}'"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install TensorFold-arm
        run: |
          pip install -e .

      - name: Verify TensorFold installation
        run: |
          python -c "import tensorfold; print('TensorFold imported successfully')"

      - name: Verify benchmark model
        run: |
          echo "Checking for mnist_mlp.pt..."
          ls -lh mnist_mlp.pt
          test -f mnist_mlp.pt
          echo "mnist_mlp.pt found successfully"

      - name: Run tests
        run: |
          pytest tests -v

      - name: Run ARM64 benchmark
        run: |
          python examples/benchmark_tensorfold.py

      - name: Run fused-kernel correctness tests
        run: |
          pytest tests/test_fused_backend.py -v

      - name: Run fused-kernel benchmark (ARM64)
        run: |
          python benchmarks/bench_fused_local.py
